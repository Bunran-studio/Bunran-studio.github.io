<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ジャンプ太郎</title>
<link rel="stylesheet" href="fonts/dotgothic16.css">
<style>
  html,body{margin:0;height:100%;background:#0e0f18;color:#fff;font-family:"DotGothic16","MS Gothic","Osaka-Mono",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{display:flex;height:100%;align-items:center;justify-content:center;padding-bottom:60px;box-sizing:border-box}
  body.playing #wrap{padding-bottom:0}
  #stage{position:relative;width:min(100vw,calc((100vh - 64px)*2))}
  body.playing #stage{width:min(100vw,calc(100vh*2))}
  #cv{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;background:#000}
  #ov{position:fixed;left:0;right:0;top:0;bottom:60px;display:none;overflow:auto;background:rgba(8,8,24,.72);z-index:5}
  body.playing #ov{bottom:0}
  #doc{position:fixed;inset:0;z-index:60;background:#15162a;display:flex;flex-direction:column;align-items:flex-start}
  #doc iframe{flex:1;width:100%;border:0;background:#fff}
  #doc #docBack{margin:6px 8px}
  .scr{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box;text-align:center}
  h1{margin:0;font-weight:400;font-size:clamp(34px,8vw,68px);letter-spacing:4px;color:#ffe066;text-shadow:4px 4px 0 #c92a2a,8px 8px 0 #2b2b3a}
  h2{margin:0;font-weight:400;font-size:clamp(20px,4vw,32px);text-shadow:3px 3px 0 #2b2b3a}
  p{margin:0;font-size:clamp(13px,2.2vw,17px);line-height:1.6;text-shadow:2px 2px 0 #000}
  .small{opacity:.85;font-size:13px}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .btn{background:#ffd43b;color:#2b2b3a;border:4px solid #2b2b3a;border-radius:0;padding:8px 20px;font-size:clamp(15px,2.4vw,20px);cursor:pointer;font-family:inherit;box-shadow:inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.5),4px 4px 0 #000}
  .btn:active{transform:translate(4px,4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.5)}
  .topback{position:fixed;top:8px;left:8px;z-index:6;margin:0;padding:6px 14px;font-size:clamp(12px,2.2vw,16px)}
.toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;font-size:clamp(13px,2.4vw,18px)}
a.btn{display:inline-block;text-decoration:none}
.btn.sub{background:#dee2e6}
  .btn:disabled{opacity:.5}
  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .card{background:#fff4e6;color:#2b2b3a;border:4px solid #2b2b3a;width:clamp(120px,21vw,170px);padding:10px;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.1),4px 4px 0 #000}
  .card.sel{background:#ffe066;outline:4px solid #fff}
  .card.lock canvas{filter:brightness(0) opacity(.6)}
  .btn.mini{font-size:12px;padding:4px 8px;margin-top:4px;width:100%}
  .card canvas{width:64px;height:64px;image-rendering:pixelated}
  .card b{font-size:18px;font-weight:400}
  .card small{font-size:12px;line-height:1.4}
  .stat{font-size:12px;width:100%;display:flex;justify-content:space-between}
  .stat i{font-style:normal;color:#e8590c}
  .serow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:3px 0}
  .serow span{width:6em;text-align:right;font-size:14px;margin-right:4px}
  .vol{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font-size:15px}
  .vol input{accent-color:#ffd43b;vertical-align:middle;width:130px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tab{border:4px solid #2b2b3a;border-radius:0;padding:4px 12px;font-family:inherit;background:#495057;color:#dee2e6;cursor:pointer;font-size:15px;box-shadow:3px 3px 0 #000}
  .tab.on{background:var(--c);color:#fff}
  .tab:disabled{opacity:.45}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(720px,100%)}
  .days{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .day{border:4px solid #2b2b3a;background:#fff4e6;color:#2b2b3a;padding:4px 6px;min-width:58px;display:flex;flex-direction:column;align-items:center;font-size:13px;box-shadow:3px 3px 0 #000;position:relative}
  .day b{font-weight:400;font-size:12px}
  .day.got{background:#b2f2bb;opacity:.8}
  .day.today{background:#ffe066;outline:4px solid #fff}
  .day i{position:absolute;right:2px;top:0;font-style:normal;color:#2b8a3e}
  .book{width:min(760px,100%)}
  .bkrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
  .bk{width:86px;background:#fff4e6;color:#2b2b3a;border:3px solid #2b2b3a;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;box-shadow:3px 3px 0 #000}
  .bk img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
  .bk.no{background:#868e96}
  .bk.no img{filter:brightness(0) opacity(.45)}
  .bkrw{margin-bottom:6px}
  .skimg{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}
  .card.lock .skimg{filter:brightness(0) opacity(.6)}
  .bring{font-size:12px;display:flex;gap:4px;align-items:center}
  .whead{grid-column:1/-1;text-align:left;font-size:15px;margin:8px 0 0;padding:2px 8px;border-left:6px solid #ffd43b;text-shadow:2px 2px 0 #000}
  .whead.soon{border-color:#74c0fc;color:#a5d8ff;margin-bottom:4px}
  .st{border:4px solid #2b2b3a;border-radius:0;padding:6px 4px;background:#fff4e6;color:#2b2b3a;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),4px 4px 0 #000}
  .st b{font-size:22px;font-weight:400}
  .st span{font-size:11px}
  .st small{font-size:10px}
  .st.clr{background:#b2f2bb}
  .st:disabled{background:#495057;color:#adb5bd}
  .res{background:#2b2b3a;border:4px solid #fff;box-shadow:4px 4px 0 #000;padding:10px 18px;font-size:16px;line-height:1.9}
  .new{color:#ffd43b}
  body.noads #ad{display:none}
  #ad{position:fixed;left:50%;bottom:5px;transform:translateX(-50%);width:320px;max-width:100vw;height:50px;background:#2a2e38;border:2px dashed #667;display:flex;align-items:center;justify-content:center;font-size:12px;color:#99a;z-index:6}
  body.playing #ad,body.native #ad{display:none}
  #pad{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 10px 8px;pointer-events:none}
  #pad .g{display:flex;gap:12px}
  #pad button{pointer-events:auto;width:var(--ps,68px);height:var(--ps,68px);border-radius:0;border:4px solid rgba(255,255,255,.75);background:rgba(255,255,255,var(--pa,.25));color:#fff;font-size:24px;touch-action:none;user-select:none;-webkit-user-select:none}
  #pad button.on{background:rgba(255,255,255,.6);transform:scale(.94)}
  #pad .g{align-items:flex-end}
  #pad .jump{width:calc(var(--ps,68px) * 1.25);height:calc(var(--ps,68px) * 1.25);font-size:30px}
  #pad .fire{margin-bottom:calc(var(--ps,68px) * .35);border-color:rgba(255,169,77,.9)}
  @media (pointer:coarse){body.playing #pad{display:flex}}
  #pauseBtn{position:absolute;top:3px;right:6px;display:none;border:2px solid #fff;border-radius:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;padding:4px 14px;cursor:pointer;font-family:inherit}
  .topbar{position:absolute;top:8px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:2}
  .topbar .sp{flex:1}
  .pill{background:#2b2b3a;border:3px solid #fff;padding:4px 12px;font-size:16px;box-shadow:3px 3px 0 #000}
  .ico{position:relative;background:#fff4e6;color:#2b2b3a;border:4px solid #2b2b3a;width:60px;height:60px;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15),3px 3px 0 #000;padding:0}
  .ico small{font-size:10px;line-height:1}
  .ico:active{transform:translate(3px,3px);box-shadow:none}
  .badge{position:absolute;top:-9px;right:-9px;background:#e03131;color:#fff;font-style:normal;font-size:12px;width:20px;height:20px;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
  .btn.big{font-size:clamp(20px,3.4vw,30px);padding:12px 48px}
  .row.icons{gap:18px}
  .scr.title{padding-top:72px}
  .howto{width:min(560px,100%);display:flex;flex-direction:column;gap:6px}
  .hrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);padding:6px 10px;text-align:left;font-size:14px}
  .hk{min-width:56px;text-align:center;font-size:22px}
  .hw{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
  .setbody{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px}
  @media (max-height:430px){h1{font-size:40px}.scr{gap:8px}.scr.title{padding-top:64px}}
  body.playing #pauseBtn{display:block}

</head>

function build(i, d) {
  const S = STAGES[i];
  const L = { cols: S.len, g: [], en: [], coins: [], secrets: [], warps: [], fakes: [], cps: [], neko: null, boss: null, shots: [], items: [], food: null, foodKey: S.food, goal: S.len - 6,
              theme: THEMES[S.theme], crumb: new Map(), secretTotal: 0 };
  for (let y = 0; y < H; y++) L.g.push(Array(S.len).fill(' '));
  let lo = 0, hi = 3, sid = 0;
  const ok = () => d >= lo && d <= hi;
  const set = (x, y, c) => { if (x >= 0 && x < S.len && y >= 0 && y < H) L.g[y][x] = c; };
  const B = {
    gr: (a, b, top = 9) => { if (ok()) for (let x = a; x <= b; x++) for (let y = top; y < H; y++) set(x, y, '#'); },
    ceil: (a, b, n) => { if (ok()) for (let x = a; x <= b; x++) for (let y = 0; y < n; y++) set(x, y, '#'); },
    t: (x, y, c, n = 1) => { if (ok()) for (let k = 0; k < n; k++) set(x + k, y, c); },
    col: (x, y0, y1, c) => { if (ok()) for (let y = y0; y <= y1; y++) set(x, y, c); },
    c: (x, y, n = 1) => { if (ok()) for (let k = 0; k < n; k++) L.coins.push({ x: (x + k) * T + 8, y: y * T + 8, id: (x + k) + ',' + y }); },
    e: (type, x, row = 9) => {
      if (!ok()) return;
      const s = EN[type];
      L.en.push({ type, x: x * T + (T - s.w) / 2, y: type === 'b' ? row * T : row * T - s.h, by: row * T, w: s.w, h: s.h,
                  vx: -s.sp * DIFFS[d].es, vy: 0, alive: true, squish: 0, t: (x * 7) % 80 });
    },
    sp: (x, n = 1, row = 8) => B.t(x, row, '^', n),
    sec: (x, y) => { L.secrets.push({ x: x * T - 8, y: y * T - 8, w: T + 16, h: T + 16, id: sid++ }); },
    warp: (a, b, to) => { const id = sid++; if (ok()) L.warps.push({ a, b, to, id }); },
    boss: (type, ax) => {
      const S = BOSSES[type];
      L.boss = { type, ax, started: false, dead: false, deadT: 0, hp: S.hp[d], maxHp: S.hp[d], w: S.w, h: S.h,
                 x: (ax + 15) * T, y: type === 'raijin' ? 56 : 9 * T - S.h, vx: 0, vy: 0, t: 0, n: 0, st: type === 'raijin' ? 'fly' : (type === 'oni' || type === 'trex') ? 'walk' : type === 'ninja' ? 'hide' : 'wait', inv: 0, vis: type !== 'ninja' };
      L.goal = ax + 18;
    },
    food: (x, y) => { L.food = { x: x * T + 4, y: y * T + 4, w: 24, h: 24 }; },
    neko: (x, y) => { L.neko = { x: x * T + 4, y: y * T + 4, w: 24, h: 28 }; },
    fake: x => { if (ok()) L.fakes.push({ x, done: false, fy: 0 }); },
    cp: (x, maxD = 1) => { if (d <= maxD) L.cps.push({ x, on: false }); },
    stairs: (x, n) => { if (ok()) for (let k = 0; k < n; k++) for (let h = 0; h <= k; h++) set(x + k, 8 - h, '#'); },
    at: (dd, fn) => { const o = lo; lo = Math.max(lo, dd); fn(); lo = o; },
    upto: (dd, fn) => { const o = hi; hi = Math.min(hi, dd); fn(); hi = o; },
  };
  S.make(B);
  L.secretTotal = sid;
  return L;
}

const SOLID = '#B?!=V';
function solid(tx, ty) {
  if (tx < 0 || tx >= L.cols) return true;

  return SOLID.includes(L.g[ty][tx]);
}

function moveTile(e, isP) {
  let hx = false, on = false;
  e.x += e.vx;
  let l = Math.floor(e.x / T), r = Math.floor((e.x + e.w - 1) / T), t = Math.floor(e.y / T), b = Math.floor((e.y + e.h - 1) / T);
  for (let ty = t; ty <= b; ty++) {
    if (e.vx > 0 && solid(r, ty)) { e.x = r * T - e.w; hx = true; break; }
    if (e.vx < 0 && solid(l, ty)) { e.x = (l + 1) * T; hx = true; break; }
  }
  e.y += e.vy;
  l = Math.floor(e.x / T); r = Math.floor((e.x + e.w - 1) / T); t = Math.floor(e.y / T); b = Math.floor((e.y + e.h - 1) / T);
  if (e.vy > 0) {
    for (let tx = l; tx <= r; tx++) if (solid(tx, b)) { e.y = b * T - e.h; e.vy = 0; on = true; break; }
  } else if (e.vy < 0) {
    let best = null;
    for (let tx = l; tx <= r; tx++) {
      const hidden = isP && t >= 0 && t < H && L.g[t][tx] === 'H';
      if (solid(tx, t) || hidden) {
        const dd = Math.abs(tx * T + 16 - (e.x + e.w / 2));
        if (!best || dd < best.d) best = { tx, d: dd };
      }
    }
    if (best) { e.y = (t + 1) * T; e.vy = 0; if (isP) hitBlock(best.tx, t); }
  }
  return { hx, on };
}

function pop(x, y, n, col) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 6 - 2, life: 40, col }); }

const KI = 10, KI_MAX = 30;

function gainKi(n) {

  if (Math.floor(G.ki / KI) > before) {
    sfx.charge();
    if (!save.shotTip) { save.shotTip = 1; texts.push({ x: p.x + 12, y: p.y - 30, s: tx('🔥ボタンでショット！'), col: '#ff922b', life: 200 }); }

}

}

    for (const e of L.en) if (e.alive && hit(s, e)) { e.alive = false; e.squish = 1; s.dead = true; sfx.stomp(); pop(e.x + e.w / 2, e.y + e.h / 2, 10, '#ffd43b'); break; }
    const b = L.boss;

function hitBlock(tx, ty) {
  const c = L.g[ty][tx];
  if (c === '?' && hash(tx, ty, 42) < 0.22) {     // ときどきパワーアップアイテムが出る
    L.g[ty][tx] = '!'; sfx.cp();
    L.items.push({ kind: ITEM_KEYS[hash(tx, ty, 43) * ITEM_KEYS.length | 0], x: tx * T + 4, y: ty * T - 26, w: 24, h: 24, vx: 1.2, vy: -6 });
  } else if (c === '?' || c === 'H') {
    L.g[ty][tx] = '!'; G.dango++; sfx.dango(); gainKi(3);
    particles.push({ x: tx * T + 16, y: ty * T - 4, vx: 0, vy: -4, life: 30, col: '#ffd60a', coin: true });
    if (c === 'H') say(tx * T + 16, ty * T - 10, tx('かくしブロック！'), '#ffd43b');
  } else if (c === 'B') {
    L.g[ty][tx] = ' '; sfx.brk(); pop(tx * T + 16, ty * T + 16, 8, '#c8742b');
    L.en.forEach(e => { if (e.alive && Math.abs(e.x + e.w / 2 - (tx * T + 16)) < 26 && Math.abs(e.y + e.h - ty * T) < 6) { e.alive = false; e.squish = 1; } });
  } else sfx.bump();
}

function hitBoss(b) {      // ボスに1ダメージ（ふみつけ・ショット共通）

    L.en.forEach(e => { if (e.alive) { e.alive = false; e.squish = 1; } });
    pop(bc, b.y + b.h / 2, 30, '#ff8787'); say(ax + VW / 2, 110, tx('{0} をたおした！', S.name), '#ffd43b');

}
function updateBoss() {
  const b = L.boss;
  if (!b) return;
  const S = BOSSES[b.type], ax = b.ax * T, es = DIFFS[G.d].es, pc = p.x + p.w / 2, bc = b.x + b.w / 2;
  if (!b.started) {
    if (p.x < ax + 3 * T) return;
    b.started = true; sfx.boss(); Music.play('boss'); G.shake = 30;
    say(ax + VW / 2, 120, tx('{0} があらわれた！', S.name), '#ff8787');
  }
  if (b.dead) { b.deadT++; return; }
  b.t++; if (b.inv > 0) b.inv--;
  const wallClamp = () => {
    let hx = false;
    if (b.x < ax) { b.x = ax; hx = true; }
    if (b.x + b.w > ax + W * T) { b.x = ax + W * T - b.w; hx = true; }
    return hx;
  };
  if (b.type === 'gama') {
    if (b.st === 'wait' && b.t > 70 / es) { b.st = 'jump'; b.vy = -12.5; b.vx = clamp((pc - bc) / 40, -3.5, 3.5) * es; sfx.jump(); }
    b.vy = Math.min(b.vy + 0.5, 12);
    const m = moveTile(b, false);
    wallClamp();
    if (b.st === 'jump' && m.on && b.vy === 0 && b.t > 75 / es) {
      b.st = 'wait'; b.t = 0; b.vx = 0; G.shake = 12; sfx.bump();
      if (++b.n % 2 === 0 && L.en.filter(e => e.alive).length < 4) spawnEnemy('h', bc - 13, b.y + b.h - 22, -Math.sign(pc - bc) || -1, -6);
    }
  } else if (b.type === 'oni') {
    const dir = Math.sign(pc - bc) || 1;
    if (b.st === 'walk') {
      b.vx = dir * 1.1 * es;
      if (b.t % 100 === 50 && L.en.filter(e => e.alive).length < 3) spawnEnemy('w', bc - 13, b.y, dir * 2.5, -8);
      if (b.t > 160 / es) { b.st = 'charge'; b.t = 0; b.vx = dir * 5.5 * es; sfx.boss(); }
    } else if (b.st === 'stun') { b.vx = 0; if (b.t > 80) { b.st = 'walk'; b.t = 0; } }
    b.vy = Math.min(b.vy + 0.6, 12);
    const m = moveTile(b, false);
    if ((wallClamp() || m.hx) && b.st === 'charge') { b.st = 'stun'; b.t = 0; G.shake = 16; sfx.bump(); }
  } else if (b.type === 'ninja') {
    const dir = Math.sign(pc - bc) || 1;

    if (b.st !== 'hide') { b.vy = Math.min(b.vy + 0.6, 12); m = moveTile(b, false); wallClamp(); }
    if (b.st === 'hide') {
      b.vis = false;
      if (b.t > 45) {
        let nx = ax + 40;
        for (let k = 0; k < 12; k++) { nx = ax + 40 + Math.random() * (W * T - 80 - b.w); if (Math.abs(nx + b.w / 2 - pc) > 150) break; }
        b.x = nx; b.y = 9 * T - b.h; b.vy = 0; b.st = 'throw'; b.t = 0; b.n = 0; b.vis = true; b.face = dir;
        pop(b.x + b.w / 2, b.y + b.h / 2, 14, '#ced4da'); sfx.poof();
      }
    } else if (b.st === 'throw') {
      b.face = dir;
      if (b.t > 25 && b.t % Math.round(18 / es) === 0 && b.n < 2 + Math.min(2, G.d)) {
        const hi = b.n % 2 === 1;
        L.shots.push({ kind: 'shuriken', x: bc - 7, y: hi ? 9 * T - 64 : 9 * T - 22, vx: dir * 4.5 * es, vy: 0, w: 14, h: 14 });
        b.n++; sfx.shuriken();
      }
      if (b.t > 100) { b.st = 'leap'; b.t = 0; b.vy = -13; b.vx = clamp((pc - bc) / 30, -3, 3); }
    } else if (b.st === 'leap') {
      if (b.t > 5 && m.on) { b.st = 'land'; b.t = 0; b.vx = 0; G.shake = 8; }
    } else if (b.st === 'land') {
      b.vx = 0; if (b.t > 70 / es) { b.st = 'vanish'; b.t = 0; }
    }
    if (b.st === 'vanish') { pop(bc, b.y + b.h / 2, 14, '#ced4da'); sfx.poof(); b.vis = false; b.st = 'hide'; b.t = 0; b.vx = 0; }
  } else if (b.type === 'trex') {
    const dir = Math.sign(pc - bc) || 1;
    if (b.st !== 'charge' && b.st !== 'stun') b.face = dir;
    if (b.st === 'walk') {
      b.vx = dir * 0.9 * es;
      if (b.t > 110 / es) {
        b.st = 'roar'; b.t = 0; b.vx = 0; sfx.roar(); G.shake = 40;
        for (let k = 0; k < 2 + G.d; k++) L.shots.push({ kind: 'rock', x: clamp(pc - 14 + (k - 1) * 110 + (Math.random() - .5) * 40, ax + 8, ax + W * T - 40), y: -40 - k * 60, vx: 0, vy: 1, g: 0.22, w: 28, h: 28 });
      }
    } else if (b.st === 'roar') { b.vx = 0; if (b.t > 60) { b.st = 'charge'; b.t = 0; b.face = dir; b.vx = dir * 5 * es; } }
    else if (b.st === 'stun') { b.vx = 0; if (b.t > 90) { b.st = 'walk'; b.t = 0; } }
    b.vy = Math.min(b.vy + 0.6, 12);
    const m = moveTile(b, false);
    if ((wallClamp() || m.hx) && b.st === 'charge') { b.st = 'stun'; b.t = 0; G.shake = 18; sfx.bump(); }
  } else {
    const lowY = 9 * T - b.h, highY = 56;
    if (b.st === 'fly') {

      b.y = highY + Math.sin(b.t / 15) * 4;
      if (b.t % Math.round(75 / es) === 0) { L.shots.push({ x: bc - 6, y: b.y + b.h - 10, vx: 0, vy: 4.2 * es, w: 12, h: 26 }); sfx.thunder(); b.n++; }
      if (b.n >= 4) { b.st = 'dive'; b.n = 0; b.t = 0; b.tx = clamp(pc - b.w / 2, ax + 8, ax + W * T - b.w - 8); }
    } else if (b.st === 'dive') {
      b.x += (b.tx - b.x) * 0.08; b.y = Math.min(lowY, b.y + 4);
      if (b.y >= lowY) { b.st = 'low'; b.t = 0; G.shake = 10; }
    } else if (b.st === 'low') {
      if (b.t > 110 / es) { b.st = 'rise'; b.t = 0; }
    } else if (b.st === 'rise') {
      b.y -= 3; if (b.y <= highY) { b.y = highY; b.st = 'fly'; b.t = 0; }
    }
  }
  if (!p.dead && b.vis !== false && hit(p, b)) {
    const canStomp = b.type !== 'raijin' || b.st === 'low';
    if (canStomp && p.vy > 0 && p.y + p.h - b.y < 22) {
      if (b.inv === 0) hitBoss(b);
      p.vy = -10;
    } else if (b.inv === 0) hurt();
  }
}
function die() {
  if (p.dead) return;
  p.dead = true; p.vy = -10; p.vx = 0; G.deadT = 0; sfx.die();
}

/* ================= 更新 ================= */
function update() {
  frame++;
  particles.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += q.coin ? 0.05 : 0.4; q.life--; });
  particles = particles.filter(q => q.life > 0);
  texts.forEach(q => { q.y -= 0.6; q.life--; });
  texts = texts.filter(q => q.life > 0);
  if (screen === 'menu') { cam = (cam + 0.7) % (L.cols * T - VW); return; }
  if (screen !== 'play') return;
  if (glitch > 0) glitch--;
  if (G.introT > 0) G.introT--;
  const ch = CHARS[save.char], D = DIFFS[G.d];

  if (p.dead) {
    p.vy += GRAV; p.y += p.vy;
    if (++G.deadT > 80) {
      G.lives--; G.deaths++;
      if (G.lives <= 0) gameOver(); else respawn();
    }
    return;
  }
  if (G.clearT > 0) {
    p.vx = 1.5; p.vy = Math.min(p.vy + GRAV, 14); p.on = moveTile(p, false).on;
    if (++G.clearT > 70) finishStage();
    return;
  }
  G.time++;
  for (const k in G.pow) if (G.pow[k] > 0) G.pow[k]--;
  if (p.inv > 0) p.inv--;
  if (G.deaths === 0 && G.time % 2 === 0) G.rec.push(Math.round(p.x), Math.round(p.y));

  // 横移動
  const dx = K.r - K.l;
  if (dx) p.dir = dx;
  const th = L.theme, slip = th.slip && p.on;
  const tgt = dx * ch.run * (th.water ? 0.7 : 1) * (G.pow.geta > 0 ? 1.35 : 1), acc = p.on ? (slip ? ch.acc * 0.3 : ch.acc) : ch.acc * 0.65;
  if (dx) p.vx += Math.sign(tgt - p.vx) * Math.min(acc, Math.abs(tgt - p.vx));
  else p.vx *= p.on ? (slip ? 0.97 : 0.78) : (th.water ? 0.9 : 0.95);
  if (Math.abs(p.vx) < 0.05) p.vx = 0;

  // ジャンプ（先行入力・コヨーテタイム・可変ジャンプ・滑空）
  if (th.water) {                     // 水中：何度でも泳げる
    if (K.j && !prevJ) { p.vy = -4.6 - ch.jump * 0.05; sfx.swim(); }
    prevJ = K.j;
    p.vy = Math.min(p.vy + 0.17, 2.4);
    if (p.y < 4 && p.vy < 0) p.vy = 0;
  } else {
    if (K.j && !prevJ) jumpBuf = 7;
    prevJ = K.j;
    if (jumpBuf > 0) jumpBuf--;
    coyote = p.on ? 7 : Math.max(0, coyote - 1);
    if (p.on) p.dbl = false;
    if (jumpBuf > 0 && coyote > 0) { p.vy = -ch.jump; jumpBuf = 0; coyote = 0; sfx.jump(); }
    else if (ch.dbl && jumpBuf > 0 && !p.dbl) {   // 2段ジャンプ
      p.vy = -ch.jump * 0.9; p.dbl = true; jumpBuf = 0; sfx.jump(); pop(p.x + p.w / 2, p.y + p.h, 8, '#ffd43b');
    }
    if (!K.j && p.vy < -4) p.vy = -4;
    p.vy = Math.min(p.vy + GRAV, 14);
    if (ch.glide && K.j && p.vy > 1.6) p.vy = 1.6;
  }

  if (K.f && !prevF) fire();
  prevF = K.f;
  p.on = moveTile(p, true).on;
  if (p.on) G.combo = 0;

  // くずれる足場
  if (p.on) {
    const fy = Math.round((p.y + p.h) / T), l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 1) / T);
    for (let x = l; x <= r; x++) if (L.g[fy] && L.g[fy][x] === 'V' && !L.crumb.has(x + ',' + fy)) L.crumb.set(x + ',' + fy, 1);
  }
  for (const [k, v] of L.crumb) {
    if (v > 28) {
      const [x, y] = k.split(',').map(Number);
      L.g[y][x] = ' '; L.crumb.delete(k); pop(x * T + 16, y * T + 16, 6, '#a0703a');
    } else L.crumb.set(k, v + 1);
  }

  // 落下 → ワープ穴 or ミス
  if (p.y > H * T + 10) {
    const col = Math.floor((p.x + p.w / 2) / T);
    const w = L.warps.find(w => col >= w.a && col <= w.b);
    if (w) {
      let r = 0; while (r < H && solid(w.to, r)) r++;
      p.x = w.to * T + 5; p.y = r * T + 2; p.vy = 1; p.vx = 0;
      glitch = 45; sfx.warp();
      cam = clamp(p.x - VW / 2, 0, L.cols * T - VW);
      findSecret(w.id, p.x, p.y + 60);
    } else if (p.y > H * T + 40) { die(); return; }
  }

  // トゲ
  const l = Math.floor(p.x / T), rr = Math.floor((p.x + p.w - 1) / T), t = Math.floor(p.y / T), b = Math.floor((p.y + p.h - 1) / T);
  for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= rr; tx++)
    if (L.g[ty] && L.g[ty][tx] === '^' && p.y + p.h > ty * T + 16) { hurt(false); if (!p.dead) p.vy = -8; }

  // コイン・ひみつ・チェックポイント
  if (G.pow.magnet > 0) for (const c of L.coins) {     // まねきの手：金平糖をすいよせる
    const ddx = p.x + 3 - c.x, ddy = p.y + 4 - c.y;
    if (!G.got.has(c.id) && ddx * ddx + ddy * ddy < 170 * 170) { c.x += ddx * 0.14; c.y += ddy * 0.14; }
  }
  for (const c of L.coins) if (!G.got.has(c.id) && hit(p, { x: c.x, y: c.y, w: 16, h: 16 })) { G.got.add(c.id); addCoin(); }
  for (const it of L.items) {
    if (it.got) continue;
    it.vy = Math.min(it.vy + 0.4, 8); const m = moveTile(it, false);
    if (m.hx) it.vx = -it.vx; if (m.on) it.vx *= 0.92;
    if (it.y > VH + 40) it.got = true;
    if (hit(p, it)) { it.got = true; usePower(it.kind); }
  }
  if (L.neko && !G.neko && !G.nekoHint && Math.abs(L.neko.x - p.x) < 7 * T) {     // 近づくと鳴いて場所を教える
    G.nekoHint = true; sfx.meow(); texts.push({ x: L.neko.x + 12, y: L.neko.y - 14, s: tx('にゃ〜ん♪'), col: '#ffc9de', life: 140 });
  }
  if (L.neko && !G.neko && hit(p, L.neko)) nekoBlessing();
  if (L.food && !G.food && hit(p, L.food)) { G.food = true; sfx.clear(); say(L.food.x + 12, L.food.y - 10, tx('ごちそう「{0}」ゲット！', FOODS[L.foodKey].name), '#ffd43b'); }
  for (const s of L.secrets) if (hit(p, s)) findSecret(s.id, s.x + 24, s.y);
  for (const c of L.cps) if (!c.on && p.x + p.w > c.x * T + 10) { c.on = true; G.cp = c.x; sfx.cp(); say(c.x * T + 16, 5 * T, tx('チェックポイント！'), '#69db7c'); }

  // ニセゴール
  for (const f of L.fakes) {
    if (!f.done && p.x + p.w / 2 > f.x * T + 16) {
      f.done = true; f.deaths = G.deaths; sfx.troll(); say(f.x * T + 16, 4 * T, tx('ニセ鳥居だった！しめ縄がないのが目じるし'), '#ff8787');
      for (let x = f.x - 1; x <= f.x + 2; x++) for (let y = 9; y < H; y++) { L.g[y][x] = ' '; }
      pop(f.x * T + 16, 9 * T, 12, L.theme.pal.base);
    }
    if (f.done) f.fy += 3;
    if (f.done && !f.judged) {     // 落ちずにとびこえたら「見ぬいた！」ボーナス
      if (p.y > 9 * T + 4 && Math.abs(p.x + p.w / 2 - (f.x * T + 16)) < 3 * T) f.fell = true;
      if (p.x > (f.x + 3) * T && !p.dead) {
        f.judged = true;
        if (!f.fell && G.deaths === f.deaths) { G.coins += 20; sfx.secret(); say(p.x + 12, p.y - 20, tx('見ぬいた！ おやつ+20'), '#69db7c'); }
      }
    }
  }

  // 敵
  const cx = cam + VW / 2;
  for (const e of L.en) {
    if (!e.alive) { if (e.squish > 0) e.squish++; continue; }
    if (Math.abs(e.x - cx) > VW * 0.75) continue;
    e.t++;
    if (e.type === 'b') {
      const ddx = p.x - e.x;
      if (Math.abs(ddx) < 320) e.vx = clamp(e.vx + Math.sign(ddx) * 0.04 * D.es, -1.6 * D.es, 1.6 * D.es);
      e.x += e.vx; e.y = e.by + Math.sin(e.t / 20) * 24;
    } else {
      e.vy = Math.min(e.vy + GRAV, 12);
      const m = moveTile(e, false);
      if (m.hx) e.vx = -e.vx;
      if (e.type === 'h' && m.on && e.t % 80 === 0) e.vy = -9;
      if (e.y > H * T + 60) e.alive = false;
    }
    save.seen[(L.theme.skin && L.theme.skin[e.type]) || e.type] = 1;
    if (G.pow.mallet > 0 && hit(p, e)) { e.alive = false; e.squish = 1; sfx.stomp(); pop(e.x + e.w / 2, e.y, 8, '#ffd43b'); continue; }
    if (hit(p, e)) {
      if (e.type !== 'n' && p.vy > 0 && p.y + p.h - e.y < 16) {
        e.alive = false; e.squish = 1; sfx.stomp(); stompReward(e);
        p.vy = th.water ? -4 : (K.j ? -ch.jump * 0.85 : -8);
      } else hurt();
      if (p.dead) return;
    }
  }

  updatePShots();
  updateShots();
  if (p.dead) return;
  updateBoss();
  if (p.dead) return;
  const bo = L.boss;
  if (bo && bo.started && !bo.dead) p.x = clamp(p.x, bo.ax * T, (bo.ax + W) * T - p.w);
  if (G.shake > 0) G.shake--;

  // ゴール（ボスがいるステージは、たおしてから）
  if ((!bo || (bo.dead && bo.deadT > 90)) && p.x + p.w > L.goal * T + 12) { G.clearT = 1; Music.stop(); sfx.clear(); p.vx = 0; }

  cam = bo && bo.started ? cam + (bo.ax * T - cam) * 0.15 : clamp(p.x - VW / 2 + 12, 0, L.cols * T - VW);
}

/* ================= 広告（ダミー） =================
  アプリ化後、この中身を AdMob（@capacitor-community/admob）の呼び出しに差し替える */
const Ads = {
  ready: false, bannerWant: false, bannerShown: false, cb: null, rewardedOk: false,
  async init() {
    if (!AdMobP) return;
    try {
      await AdMobP.initialize({ initializeForTesting: AD_TESTING, tagForChildDirectedTreatment: false, maxAdContentRating: 'ParentalGuidance' });
      try {
        const ci = await AdMobP.requestConsentInfo();
        if (ci.isConsentFormAvailable && ci.status === 'REQUIRED') await AdMobP.showConsentForm();
      } catch (e) {}
      AdMobP.addListener('interstitialAdDismissed', () => this.end());
      AdMobP.addListener('interstitialAdFailedToShow', () => this.end());
      AdMobP.addListener('onRewardedVideoAdReward', () => { this.rewardedOk = true; });
      AdMobP.addListener('onRewardedVideoAdDismissed', () => this.end());
      AdMobP.addListener('onRewardedVideoAdFailedToShow', () => { this.rewardedOk = true; this.end(); });
      this.ready = true; this.preload(); this.banner(this.bannerWant);
    } catch (e) { console.warn('AdMob init', e); }
  },
  preload() {
    if (!this.ready) return;
    AdMobP.prepareInterstitial({ adId: AD_IDS.interstitial, isTesting: AD_TESTING }).catch(() => {});
    AdMobP.prepareRewardVideoAd({ adId: AD_IDS.rewarded, isTesting: AD_TESTING }).catch(() => {});
  },
  banner(on) {
    if (save.noAds) on = false;
    this.bannerWant = on;
    if (!this.ready) return;
    if (on) {
      if (!this.bannerShown) { this.bannerShown = true; AdMobP.showBanner({ adId: AD_IDS.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 0, isTesting: AD_TESTING }).catch(() => { this.bannerShown = false; }); }
      else AdMobP.resumeBanner().catch(() => {});
    } else if (this.bannerShown) AdMobP.hideBanner().catch(() => {});
  },
  // ほかのアプリ（ブラウザなど）からもどったとき、バナーの位置がずれないように出しなおす
  refreshBanner() {
    if (!this.ready || !this.bannerShown) return;
    AdMobP.removeBanner().catch(() => {}).then(() => { this.bannerShown = false; this.banner(this.bannerWant); });
  },
  end() { const cb = this.cb; this.cb = null; Music.duckOn(false); this.preload(); if (cb) cb(); },
  interstitial(done) {
    if (!AD_CONFIG.enabled || save.noAds) return done();
    if (CG) return this._cg('midgame', done, done);
    if (!NATIVE) return this._demo(tx('全画面広告（ダミー）'), 3, done, false);
    if (!this.ready) return done();
    Music.duckOn(true); this.cb = done;
    AdMobP.showInterstitial().catch(() => this.end());
  },
  rewarded(done, msg = tx('コンティニュー')) {
    if (!AD_CONFIG.enabled || save.noAds) return done();
    if (CG) return this._cg('rewarded', done, () => toast(tx('広告を読みこめませんでした。少しまってからためしてね')));
    if (!NATIVE) return this._demo(tx('リワード広告（ダミー）\n最後まで見ると{0}！', msg), 4, done, true);
    if (!this.ready) return done();
    Music.duckOn(true); this.rewardedOk = false;
    this.cb = () => { if (this.rewardedOk) done(); };
    AdMobP.showRewardVideoAd().catch(() => { this.rewardedOk = true; this.end(); });
  },
  _cg(type, done, fail) {
    const end = ok => { Music.duckOn(false); ok ? done() : fail(); };
    CG.ad.requestAd(type, { adStarted: () => Music.duckOn(true), adFinished: () => end(true), adError: () => end(type === 'midgame') });
  },
  _demo(text, sec, done, mustWatch) {
    let s = sec; Music.duckOn(true);
    showOv(`<div class="scr"><p style="white-space:pre-line;font-size:clamp(16px,3vw,24px)">${text}</p>
      <div style="width:min(480px,80%);aspect-ratio:16/7;background:#333;border:2px dashed #889;display:flex;align-items:center;justify-content:center">${tx('ここに広告が表示されます')}</div>
      <button class="btn sub" id="adBtn" ${mustWatch ? 'disabled' : ''}>${tx('あと {0} 秒', s)}</button></div>`);
    const b = $('adBtn');
    const iv = setInterval(() => {
      s--;
      if (s > 0) { b.textContent = tx('あと {0} 秒', s); return; }
      clearInterval(iv); b.disabled = false; b.textContent = mustWatch ? tx('報酬を受け取る') : tx('閉じる');
      b.onclick = () => { hideOv(); Music.duckOn(false); done(); };
    }, 1000);
  },
};

const Shop = {
  price: null, ok: false,
  async init() {
    if (!IAPP || !SHOP_ON) return;
    try {
      const r = await IAPP.isBillingSupported();
      if (!r.isBillingSupported) return;
      this.ok = true;
      const { products } = await IAPP.getProducts({ productIdentifiers: [IAP_REMOVE_ADS], productType: 'inapp' });

      await this.check();

  owned: t => t.productIdentifier === IAP_REMOVE_ADS && (t.purchaseState === undefined || String(t.purchaseState) === '1'),

};
// 広告なしパックの特典をつける／はずす（返金されたときははずす）
function setNoAds(v) {
  save.noAds = !!v;

  const claim = mult => {

/* ================= 描画（まるいドット絵） ================= */
const FONT = '"DotGothic16","MS Gothic",monospace';
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function painter(c, seed = 7) {
  const x = c.getContext('2d'); let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const px = (X, Y, col, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(X | 0, Y | 0, w | 0, h | 0); };
  const disc = (cx, cy, r, col) => { x.fillStyle = col; for (let yy = -r; yy <= r; yy++) { const w = Math.floor(Math.sqrt(r * r - yy * yy) + 0.3); x.fillRect((cx - w) | 0, (cy + yy) | 0, w * 2 + 1, 1); } };
  return { px, disc, rnd, x };
}
const hash = (x, y, s = 0) => {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
// 16x16 のピクセル画を「内側判定」と「色決め」から作る共通関数
function shapeTile(inside, colorOf) {
  const c = mkCanvas(16, 16), g = c.getContext('2d'), img = g.createImageData(16, 16);
  const dist = (x, y, dx, dy, cap) => { for (let k = 1; k <= cap; k++) if (!inside(x + dx * k, y + dy * k)) return k; return 99; };
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (!inside(x, y)) continue;
    const col = colorOf(x, y, dist(x, y, 0, -1, 12), dist(x, y, 0, 1, 4), dist(x, y, -1, 0, 4), dist(x, y, 1, 0, 4));
    if (!col) continue;
    const i = (y * 16 + x) * 4, n = parseInt(col.slice(1, 7), 16);
    img.data[i] = n >> 16; img.data[i + 1] = (n >> 8) & 255; img.data[i + 2] = n & 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* ---------- 地形（角がまるいオートタイル） ---------- */
const TERRAIN = {};
const STONES = [[3, 3], [11, 2], [7, 8], [1, 12], [12, 11], [15, 7]];
function stoneCol(P, x, y, soft) {           // 石垣：ふぞろいな丸い石
  let d1 = 1e9, d2 = 1e9, idx = 0;
  for (let i = 0; i < STONES.length; i++) for (const ox of [-16, 0, 16]) for (const oy of [-16, 0, 16]) {
    const dx = x + .5 - STONES[i][0] - ox, dy = (y + .5 - STONES[i][1] - oy) * 1.3, d = Math.sqrt(dx * dx + dy * dy);
    if (d < d1) { d2 = d1; d1 = d; idx = i; } else if (d < d2) d2 = d;
  }
  if (d2 - d1 < 1.1) return soft ? P.dark : P.line;
  if (d2 - d1 < 2.2) return soft ? P.base : P.dark;
  return idx % 3 === 0 ? P.light : idx % 3 === 1 ? P.base : (P.mid || P.base);
}
function matTex(M, P, x, y) {
  const h = hash(x, y, 9);
  if (M === 'ishigaki') return stoneCol(P, x, y);
  if (M === 'kawara') { const xx = (x + (Math.floor(y / 4) % 2) * 3) % 6; if (y % 4 === 3 || xx === 0) return P.dark; return xx === 1 ? P.light : P.base; }
  if (M === 'wood') { if (y % 5 === 4) return P.dark; if ((x + Math.floor(y / 5) * 7) % 16 === 0) return P.dark; return hash(x >> 2, y, 3) < 0.1 ? P.light : P.base; }
  if (M === 'city') { if (y % 8 === 7) return P.dark; if ((x + (y >> 3) * 8) % 16 === 0) return P.dark; return h < 0.06 ? P.light : P.base; }
  if (M === 'cloud') return h < 0.04 ? P.dark : P.base;
  if (M === 'rock') return stoneCol(P, x, y, true);
  if (h < 0.07) return P.dark; if (h > 0.96) return P.light;
  return hash(x >> 1, y >> 1, 2) < 0.05 ? P.light : P.base;
}
function matTop(M, P, x, dt, depth) {
  if (M === 'city') { if (dt === depth) return P.top[2]; if (x % 8 === 0) return P.top[1]; return dt === 2 ? '#f8f9fa' : P.top[0]; }
  if (M === 'cloud') return '#ffffff';
  if (dt === 2) return P.top[0];
  if (dt === depth) return P.top[2];
  return hash(x, dt, 1) < 0.15 ? P.top[0] : P.top[1];
}
function terrainTile(th, mask) {      // mask: 1=上 2=右 4=下 8=左 がつながっている
  const store = TERRAIN[th.key] || (TERRAIN[th.key] = []);
  if (store[mask]) return store[mask];
  const U = mask & 1, R = mask & 2, D = mask & 4, Lf = mask & 8, r = th.round, P = th.pal, M = th.mat;
  const inTile = (x, y) => {
    const left = x < r, right = x > 15 - r, top = y < r, bot = y > 15 - r;
    if (!(left || right) || !(top || bot)) return true;
    if (!((left ? !Lf : !R) && (top ? !U : !D))) return true;
    const cx = left ? r : 16 - r, cy = top ? r : 16 - r;
    return (x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r;
  };
  const inside = (x, y) => x < 0 ? !!Lf : x > 15 ? !!R : y < 0 ? !!U : y > 15 ? !!D : inTile(x, y);
  const drip = x => (M === 'grass' && ((!Lf && x <= 1) || (!R && x >= 14))) ? 3 : 0;
  const tile = shapeTile(inside, (x, y, dt, db, dl, dr) => {
    let col = matTex(M, P, x, y);
    const depth = (M === 'city' ? 6 : M === 'grass' ? 3 + (hash(x, 0, 5) * 3 | 0) : 3) + drip(x);
    if (dt <= depth) col = matTop(M, P, x, dt, depth);
    else if (db <= 2) col = P.shade;
    else if (dr <= 2) col = P.dark;
    else if (dl === 2) col = P.light;
    if (Math.min(dt, db, dl, dr) === 1) col = P.line;
    return col;
  });
  return (store[mask] = tile);
}

/* ---------- 足場（ステージごとに素材がかわる） ---------- */
const PLAT = {};
function platTile(th, part, fake) {   // part: S=単独 L=左端 M=中 R=右端
  const k = th.key + part + (fake ? 'F' : '');
  if (PLAT[k]) return PLAT[k];
  const kind = th.plat, exL = part === 'S' || part === 'L', exR = part === 'S' || part === 'R';
  const r = kind === 'girder' || kind === 'roof' ? 3 : 5;
  const topY = x => kind === 'puff' ? 2 + Math.round(1.3 + 1.3 * Math.sin(x / 2.3 + (part === 'R' ? 2 : 0))) : 3;
  const inT = (x, y) => {
    const t = topY(x);
    if (y < t || y > 12) return false;
    const mid = (t + 13) / 2, hh = (13 - t) / 2;
    if (exL && x < r) return ((x + .5 - r) / r) ** 2 + ((y + .5 - mid) / hh) ** 2 <= 1;
    if (exR && x > 15 - r) return ((x + .5 - (16 - r)) / r) ** 2 + ((y + .5 - mid) / hh) ** 2 <= 1;
    return true;
  };
  const inside = (x, y) => (x < 0 && !exL) || (x > 15 && !exR) ? (y >= 3 && y <= 12) : (x < 0 || x > 15 || y < 0 || y > 15) ? false : inT(x, y);
  const LINE = { log: '#3b2512', girder: '#5c0a0a', puff: '#74c0fc', crystal: '#1a1430', roof: '#1e2130', ice: '#1c7ed6', coral: '#a61e4d', bone: '#868e96', amber: '#a85d00', tatami: '#2b2b3a' }[kind];
  const tile = shapeTile(inside, (x, y, dt, db, dl, dr) => {
    if (Math.min(dt, db, dl, dr) === 1) return LINE;
    if (kind === 'log') {
      for (const [ex, cx] of [[exL, r], [exR, 16 - r]]) if (ex && Math.abs(x + .5 - cx) < r) {
        const d = Math.hypot((x + .5 - cx) / r, (y - 7.5) / 4.5);
        if ((x < r && x + .5 < cx) || (x > 15 - r && x + .5 > cx)) return d > 0.45 && d < 0.65 ? '#a0703a' : d < 0.2 ? '#a0703a' : '#e0b07a';
      }
      if (dt === 2) return '#d4955a';
      if (db <= 2) return '#6f4518';
      if (y === (fake ? 7 : 6) && hash(x, y, 3) > 0.3) return '#7a4a22';
      if (y === 9 && hash(x, y, 4) > 0.4) return '#7a4a22';
      return '#a0683a';
    }
    if (kind === 'girder') {
      if ((x - (fake ? 7 : 8)) ** 2 + (y - 7.5) ** 2 < 5) return null;   // 穴（背景が見える）
      if ([[2, 4], [13, 4], [2, 11], [13, 11]].some(([a, b]) => a === x && b === y)) return '#ffc9c9';
      if (y <= 4) return dt === 2 ? '#ff8787' : '#e03131';
      if (y >= 11) return '#a51111';
      return '#c92a2a';
    }
    if (kind === 'puff') { if (dt <= 2) return '#ffffff'; if (db <= 3) return '#a5d8ff'; return fake ? '#e3f2ff' : '#e7f5ff'; }
    if (kind === 'crystal') {
      if (dt <= 2) return '#b197fc'; if (db <= 2) return '#3b2a80';
      return (x + y + (fake ? 1 : 0)) % 6 === 0 ? '#9775fa' : '#5f3dc4';
    }
    if (kind === 'ice') { if (dt <= 2) return '#ffffff'; if (db <= 2) return '#74c0fc'; return (x - y + 16 + (fake ? 1 : 0)) % 7 === 0 ? '#e7f5ff' : '#a5d8ff'; }
    if (kind === 'coral') { if (dt <= 2) return '#ffc9de'; if (db <= 2) return '#c2255c'; return hash(x + (fake ? 1 : 0), y, 6) < 0.2 ? '#faa2c1' : '#f06595'; }
    if (kind === 'bone') { if (dt <= 2) return '#ffffff'; if (db <= 2) return '#ced4da'; return (x === (fake ? 9 : 8) && y > 6 && y < 10) ? '#ced4da' : '#f1f3f5'; }
    if (kind === 'amber') { if (dt <= 2) return '#ffe8a1'; if (db <= 2) return '#e67700'; return hash(x + (fake ? 1 : 0), y, 8) < 0.12 ? '#fff3bf' : '#ffa94d'; }
    if (kind === 'tatami') { if (y <= 4 || y >= 11) return '#2f6b4f'; return (x + (fake ? 1 : 0)) % 2 ? '#c9c27a' : '#b5ad62'; }
    // roof（かわら）
    if (dt <= 2) return '#adb5bd'; if (db <= 2) return '#212529';
    const m = (x + (fake ? 1 : 0)) % 4; return m === 0 ? '#343a40' : m === 1 ? '#868e96' : '#495057';
  });
  return (PLAT[k] = tile);
}

/* ---------- まるいブロック類 ---------- */
const BOX = (() => {

  document.body.classList.add('native');
  const App = window.Capacitor.Plugins.App;
  if (App) App.addListener('resume', () => Ads.refreshBanner());
  if (App) App.addListener('backButton', () => {
    if (closeDoc()) return;
    if (screen === 'play') pause();
    else if (screen === 'pause') { screen = 'play'; hideOv(); Music.duckOn(false); }
    else if (ov.querySelector('#go')) App.exitApp();
    else if (screen === 'menu' || screen === 'clear' || screen === 'over') showTitle();
  });
}
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play') pause(); });
applyLang();
applyPad();
Ads.init();
if (CG) CG.init().catch(e => console.warn('CrazyGames SDK', e));
Shop.init().then(() => { if (screen === 'menu' && ov.querySelector('#go')) showTitle(); });
showTitle();
requestAnimationFrame(loop);
</script>
</body>
</html>
